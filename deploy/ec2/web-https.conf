limit_req_zone $binary_remote_addr zone=mateo_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=mateo_host_meetings:10m rate=12r/m;

map $http_origin $mateo_disallowed_origin {
    default 1;
    "" 0;
    "https://__PUBLIC_HOST__" 0;
}

server {
    listen 443 ssl;
    server_name __PUBLIC_HOST__;
    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/mateo/app/frontend/dist;
    access_log off;
    client_max_body_size 12m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host __PUBLIC_HOST__;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 330s;

    if ($mateo_disallowed_origin) {
        return 403;
    }

    location ~ ^/web-access(?:/(?:signup|logout))?$ {
        add_header Referrer-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        limit_req zone=mateo_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /_mateo_auth {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8000/_mateo_auth;
    }

    location = /_mateo_member_auth {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8000/_mateo_member_auth;
    }

    location = /_mateo_sign_in {
        internal;
        proxy_set_header X-Mateo-Return $request_uri;
        proxy_pass http://127.0.0.1:8000/_mateo_sign_in;
    }

    location = /join {
        auth_request /_mateo_member_auth;
        error_page 401 = /_mateo_sign_in;
        proxy_pass http://127.0.0.1:8010/join;
    }

    location = / {
        auth_request /_mateo_member_auth;
        error_page 401 = /_mateo_sign_in;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~ ^/admin(?:/|$) {
        try_files /index.html =404;
    }

    location = /api/v1/auth/login {
        limit_req zone=mateo_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/v1/(meetings/[A-Za-z0-9_-]+/join|skin/(analyze|local-rag|documents))$ {
        auth_request /_mateo_member_auth;
        proxy_pass http://127.0.0.1:8010;
    }

    location ~ ^/api/v1/meetings(?:$|/[A-Za-z0-9_-]+/agent/start$) {
        auth_request /_mateo_member_auth;
        limit_req zone=mateo_host_meetings burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/(api/|health$|ready$|docs$|redoc$|openapi\.json$) {
        auth_request /_mateo_auth;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        auth_request /_mateo_auth;
        error_page 401 = /_mateo_sign_in;
        try_files $uri $uri/ /index.html;
    }
}

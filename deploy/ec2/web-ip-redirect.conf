server {
    listen 443 ssl default_server;
    server_name __PUBLIC_IP__;
    ssl_certificate /etc/letsencrypt/live/mateo-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mateo-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    add_header Referrer-Policy no-referrer always;

    return 308 https://__PUBLIC_HOST__$request_uri;
}
